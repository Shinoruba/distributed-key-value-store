name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Project (Release)
        run: cmake --build build --config Release

      - name: Run Automated Tests (Ubuntu)
        if: runner.os == 'Linux'
        run: ./build/DistributedKVStore/kvstore-tests

      - name: Run Automated Tests (Windows)
        if: runner.os == 'Windows'
        run: .\build\DistributedKVStore\Release\kvstore-tests.exe